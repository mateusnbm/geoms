<script>
	
	var _chart = null;
	var _metadados = null;
	
	var _geojsonUrl = {
		1: "https://raw.githubusercontent.com/mateusnbm/geoms/refs/heads/main/brasil.topojson",
		2: "https://raw.githubusercontent.com/mateusnbm/geoms/refs/heads/main/grande_regiao.topojson",
		3: "https://raw.githubusercontent.com/mateusnbm/geoms/refs/heads/main/unidade_da_federacao.topojson"
	};
	
	// ...
	
	function truncar(str, mlen) {
	
		return str.length > mlen ? str.slice(0, mlen) + "..." : str;
	
	}
	
	function combinacoes(arrays) {
	
		return arrays.reduce(
			(resultado, atual) =>
			resultado.flatMap(combinacao =>
			atual.map(item => [...combinacao, item])
			),
			[[]]
			);
	}
	
	function agregarUnidades() {
	
		_metadados.NiveisTerritoriais.forEach(nivel => {
		
			if (nivel.Id == 1) {

					{ Codigo:29, Nome: "Bahia" },
					{ Codigo:23, Nome: "Ceará" },
					{ Codigo:53, Nome: "Distrito Federal" },
					{ Codigo:32, Nome: "Espírito Santo" },
					{ Codigo:52, Nome: "Goiás" },
					{ Codigo:21, Nome: "Maranhão" },
					{ Codigo:51, Nome: "Mato Grosso" },
					{ Codigo:50, Nome: "Mato Grosso do Sul" },
					{ Codigo:31, Nome: "Minas Gerais" },
					{ Codigo:15, Nome: "Pará" },
					{ Codigo:25, Nome: "Paraíba" },
					{ Codigo:41, Nome: "Paraná" },
					{ Codigo:26, Nome: "Pernambuco" },
					{ Codigo:22, Nome: "Piauí" },
					{ Codigo:33, Nome: "Rio de Janeiro" },

					{ Codigo:43, Nome: "Rio Grande do Sul" },

			} else {
			
				nivel.Unidades = [];
			
			}
		
		});
	
	}
	
	// ...
	
	function lineChartPlot() {
		
		var pIndex = 1;
		var nIndex = 3;
		var cIndex = 4;
		
		var periodos = 
			_metadados
			.Periodos
			.filter(x => x.Mostrar ?? true)
			.map(x => x.Codigo);
		
		var variavel = $("#line-chart-form #select-eixo-y").val();
		
		var nivel = $("#line-chart-form #select-nivel").val();
		
		var unidades =
			_metadados
			.NiveisTerritoriais
			.find(x => x.Id == nivel)
			.Unidades
			.filter(x => x.Mostrar ?? true)
			.map(x => x.Codigo);
		
		// Constrói a url da api
		
		var url = `https://apisidra.ibge.gov.br/values`;
		
		// (_) Tabela
		
		url += `/t/${_metadados.Id}`;
		
		// (1) Períodos
		
		url += `/p/${periodos.join(",")}`;
		
		// (2) Variável
		
		url += `/v/${variavel}`;
		
		// (3) Nível territorial
		
		url += `/n${nivel}/${unidades.join(",")}`;
		
		// (4) Classificações: toda classificação precisa ter ao menos uma categoria selecionada 
		
		_metadados.Classificacoes.forEach((classificacao, index) => {
		
			var categorias = 
				classificacao
				.Categorias
				.filter(x => x.Mostrar ?? true)
				.map(x => x.Id)
				.join(",");
			
			url += `/c${classificacao.Id}/${categorias}`;
			
		});
		
		// Dados formatados em JSON
		
		url += `?formato=json`;
		
		// Baixa os dados 
		
		$.ajax({
			url: url,
			method: "GET",
			dataType: "json",
			success: function (data) {
				
				// Faz o mapeamento das chaves (período, classificações, unidade) para os valores
				
				var map = {};
				
				data.slice(1).forEach((datapoint) => {
					
					var classificacoes = _metadados.Classificacoes.map((x, i) => datapoint[`D${cIndex + i}C`]);
					
					var key = "";
					
					key += datapoint[`D${pIndex}C`] + "-";
					key += classificacoes.length ? classificacoes.join("-") + "-" : "";
					key += datapoint[`D${nIndex}C`];
					
					map[key] = parseFloat(datapoint.V);
				
				});
				
				// Determina as séries
				
				var conjuntos = [];
				
				_metadados.Classificacoes.forEach((classificacao) => {
				
					conjuntos.push(
						classificacao
						.Categorias
						.filter(x => x.Mostrar ?? true)
						.map(x => { return {Id: x.Id, Nome: x.Nome}; })
						);
					
				});
				
				conjuntos.push(
					_metadados
					.NiveisTerritoriais
					.find(x => x.Id == nivel)
					.Unidades
					.filter(x => x.Mostrar ?? true)
					.map(x => { return {Id: x.Codigo, Nome: x.Nome}; })
					);
					
				var series = combinacoes(conjuntos);
				
				// Constrói os datasets
				
				var datasets = [];
				
				var labels = 
					_metadados
					.Periodos
					.filter(x => x.Mostrar ?? true)
					.map(x => { return {Id: x.Codigo, Nome: x.Nome}; });
				
				series.forEach((serie) => {
					
					var ids = serie.map(x => x.Id).join("-");
					var input = $("#input-" + ids);
					
					datasets.push({
						label: input.val(),
						data: labels.map(x => map[x.Id + "-" + ids])
					});
					
					console.log(ids);
					
				});
				
				console.log(labels);
				console.log(map);
				console.log(datasets);
				
				var titulo = $("#titulo").val();
				var tituloX = $("#titulo-x").val();
				var tituloY = $("#titulo-y").val();
				
				const config = {
					type: "line",
					data: {
						labels: labels.map(x => x.Nome),
						datasets: datasets
					},
					options: {
						responsive: true,
						plugins: {
							legend: {
								position: "top",
							},
							title: {
								display: true,
								text: titulo
							}
						},
						scales: {
							x: {
								title: {
									display: true,
									text: tituloX
								}
							},
							y: {
								beginAtZero: true,
								title: {
									display: true,
									text: tituloY
								}
							}
						}
					},
				};
				
				mostrarChart(config);
				
			}
		});
	
	}

	function lineChartFormTitulos() {
		
		// Determina as séries
		
		var conjuntos = [];
		
		var select = $("#line-chart-form #select-nivel");
		var padrao = _metadados.NiveisTerritoriais[0].Id;
		var nivel = (select.length ? select.val() : padrao);
		
		_metadados.Classificacoes.forEach((classificacao) => {
				
			conjuntos.push(
				classificacao
				.Categorias
				.filter(x => x.Mostrar ?? true)
				.map(x => { return {Id: x.Id, Nome: x.Nome}; })
				);
		
		});
		
		conjuntos.push(
			_metadados
			.NiveisTerritoriais
			.find(x => x.Id == nivel)
			.Unidades
			.filter(x => x.Mostrar ?? true)
			.map(x => { return {Id: x.Codigo, Nome: x.Nome}; })
		);
		
		var series = combinacoes(conjuntos);
		
		// Gera o html com um input para cada série 
		
		var inputsHtml = "";
		
		series.forEach((serie) => {
			
			var id = serie.map(x => x.Id).join("-");
			var titulo = serie.map(x => x.Nome).join(", ");
			
			inputsHtml += `
				<div class="row mb-2">
					<div class="col">
						<div class="row">
							<div class="col">
								<input 
								type="text" 
								class="form-control" 
								value="${titulo}"
								id="input-${id}">
							</div>
						</div>
						<div class="row mt-2">
							<div class="col fst-italic text-end" style="font-size: 0.75rem;">
								<span>${titulo}</span>
							</div>
						</div>
					</div>
				</div>`;
			
		});
		
		// Constrói o html com todos os inputs
		
		var selectEixoY = $("#line-chart-form #select-eixo-y");
		var tituloEixoY = 
			selectEixoY.length ? 
			_metadados.Variaveis.find(x => x.Id == selectEixoY.val()).Nome : 
			_metadados.Variaveis[0].Nome;
		
		var html = `
			<!-- TÍTULO DO GRÁFICO -->
			<div class="row mb-2">
				<label for="titulo" class="col-3 col-form-label">Título</label>
				<div class="col">
					<input type="text" class="form-control" id="titulo" value="${_metadados.Nome}">
				</div>
			</div>
			<!-- TÍTULO DO EIXO X -->
			<div class="row mb-2">
				<label for="titulo-x" class="col-3 col-form-label">Título X</label>
				<div class="col">
					<input type="text" class="form-control" id="titulo-x" value="${_metadados.TipoPeriodo}">
				</div>
			</div>
			<!-- TÍTULO DO EIXO Y -->
			<div class="row mb-2">
				<label for="titulo-y" class="col-3 col-form-label">Título Y</label>
				<div class="col">
					<input 
					type="text" 
					class="form-control" 
					id="titulo-y" 
					value="${tituloEixoY}">
				</div>
			</div>
			<!-- TÍTULOS DAS SÉRIES -->
			<div class="row">
				<label class="col-3 col-form-label">Séries</label>
				<div class="col">
					${inputsHtml}
				</div>
			</div>
		`;
		
		return html;
	
	}

	function lineChartFormEventBtnToggles() {
		
		$(document).on("click", "#line-chart-form .btn-toggles", function() {

			if (param == "p") {

					linhas += `

	function barChartPlot() {
		
		var pIndex = 1;
		var nIndex = 3;
		var cIndex = 4;
		
		var periodos = 
			_metadados
			.Periodos
			.filter(x => x.Mostrar ?? true)
			.map(x => x.Codigo);
		
		var variavel = $("#bar-chart-form #select-eixo-y").val();
		
		var nivel = $("#bar-chart-form #select-nivel").val();
		
		var unidades =
			_metadados
			.NiveisTerritoriais
			.find(x => x.Id == nivel)
			.Unidades
			.filter(x => x.Mostrar ?? true)
			.map(x => x.Codigo);
		
		// Constrói a url da api
		
		var url = `https://apisidra.ibge.gov.br/values`;
		
		// (_) Tabela
		
		url += `/t/${_metadados.Id}`;
		
		// (1) Períodos
		
		url += `/p/${periodos.join(",")}`;
		
		// (2) Variável
		
		url += `/v/${variavel}`;
		
		// (3) Nível territorial
		
		url += `/n${nivel}/${unidades.join(",")}`;
		
		// (4) Classificações: toda classificação precisa ter ao menos uma categoria selecionada 
		
		_metadados.Classificacoes.forEach((classificacao) => {
		
			var categorias = 
				classificacao
				.Categorias
				.filter(x => x.Mostrar ?? true)
				.map(x => x.Id)
				.join(",");
			
			url += `/c${classificacao.Id}/${categorias}`;
			
		});
		
		// Dados formatados em JSON
		
		url += `?formato=json`;
		
		// ...
		
		// ...
		
		// Baixa os dados 
		
		$.ajax({
			url: url,
			method: "GET",
			dataType: "json",
			success: function (data) {
				
				// Faz o mapeamento das chaves (período, classificações, unidade) para os valores
				
				var map = {};
				
				data.slice(1).forEach((datapoint) => {
					
					var classificacoes = _metadados.Classificacoes.map((x, i) => datapoint[`D${cIndex + i}C`]);
					
					var key = "";
					
					key += datapoint[`D${pIndex}C`] + "-";
					key += classificacoes.length ? classificacoes.join("-") + "-" : "";
					key += datapoint[`D${nIndex}C`];
					
					map[key] = datapoint.V;
				
				});
				
				// Determina as séries
				
				var conjuntos = [];
				
				_metadados.Classificacoes.forEach((classificacao) => {
				
					conjuntos.push(
						classificacao
						.Categorias
						.filter(x => x.Mostrar ?? true)
						.map(x => { return {Id: x.Id, Nome: x.Nome}; })
						);
					
				});
				
				conjuntos.push(
					_metadados
					.NiveisTerritoriais
					.find(x => x.Id == nivel)
					.Unidades
					.filter(x => x.Mostrar ?? true)
					.map(x => { return {Id: x.Codigo, Nome: x.Nome}; })
					);
					
				var series = combinacoes(conjuntos);
				
				// Constrói os datasets
				
				var datasets = [];
				
				var labels = 
					_metadados
					.Periodos
					.filter(x => x.Mostrar ?? true)
					.map(x => { return {Id: x.Codigo, Nome: x.Nome}; });
				
				series.forEach((serie) => {
					
					var ids = serie.map(x => x.Id).join("-");
					var input = $("#input-" + ids);
					
					datasets.push({
						label: input.val(),
						data: labels.map(x => map[x.Id + "-" + ids])
					});
					
				});
				
				var estilo = $("#bar-chart-form #select-estilo").val();
				var empilhar = (estilo == "empilhadas");
				
				var titulo = $("#titulo").val();
				var tituloX = $("#titulo-x").val();
				var tituloY = $("#titulo-y").val();
				
				const config = {
					type: "bar",
					data: {
						labels: labels.map(x => x.Nome),
						datasets: datasets
					},
					options: {
						responsive: true,
						plugins: {
							legend: {
								position: "top",
							},
							title: {
								display: true,
								text: titulo
							}
						},
						scales: {
							x: {
								title: {
									display: true,
									text: tituloX
								},
								stacked: empilhar
							},
							y: {
								beginAtZero: true,
								title: {
									display: true,
									text: tituloY
								},
								stacked: empilhar
							}
						}
					},
				};
				
				mostrarChart(config);
				
			}
		});
		
	}

	function choroplethChartPlot() {
		
		var plotBtn = $("#btn-plot");
		var plotBtnHtml = plotBtn.html();
		
		var nivel 	 = $("#choropleth-chart-form #select-nivel").val();
		var periodo  = $("#choropleth-chart-form #select-periodo").val();
		var variavel = $("#choropleth-chart-form #select-variavel").val();
		
		// Constrói a url da api
		
		var url = `https://apisidra.ibge.gov.br/values`;
		
		// (_) Tabela
		
		url += `/t/${_metadados.Id}`;
		
		// (1) Períodos
		
		url += `/p/${periodo}`;
		
		// (2) Variável
		
		url += `/v/${variavel}`;
		
		// (3) Nível territorial
		
		url += `/n${nivel}/all`;
		
		// (4) Classificações: toda classificação precisa ter ao menos uma categoria selecionada 
		
		_metadados.Classificacoes.forEach((classificacao) => {
			
			var categoria = $(`#choropleth-chart-form #select-cla-${classificacao.Id}`).val();
			
			url += `/c${classificacao.Id}/${categoria}`;
			
		});
		
		// Dados formatados em JSON
		
		url += `?formato=json`;
		
		// Baixa os dados, geometria do brasil (contorno) e as geometrias das unidades selecionadas
		
		const urls = [
			url, 
			_geojsonUrl[1], 
			_geojsonUrl[nivel]
		];
		
		plotBtn.html(`<div class="loader"></div>`);
		plotBtn.prop("disabled", true).addClass("disabled");
		
		Promise
		.all(urls.map(url => fetch(url).then(response => response.json())))
		.then(([dados, brasil, geometrias]) => {
			
			// Faz o mapeamento dos valores para as unidades territoriais
			
			var map = {};
			
			dados.slice(1).forEach((datapoint) => {
				
				map[datapoint["D3C"]] = {
					Id: datapoint["D3C"],
					Nome: datapoint["D3N"],
					Valor: parseFloat(datapoint.V)
				};
				
			});
			
			// Formata os dados conforme esperado pelo Chart JS Geo
			
			var nomes = [];
			var unidades = [];
			
			for ([codigo, geometria] of Object.entries(geometrias.objects)) {
				
				nomes.push(map[codigo].Nome);
				
				unidades.push({
					feature: ChartGeo.topojson.feature(geometrias, geometrias.objects[codigo]).features[0],
					value: map[codigo].Valor
				});
			
			}
			
			// ...
			
			var titulo = $("#titulo").val();
			var subtitulo = $("#subtitulo").val();
			var faixas = $("#num-faixas").val();
			var paleta = $("#paleta").val();
			
			var config = {
				type: "choropleth",
				data: {
					labels: nomes,
					datasets: [{
						outline: ChartGeo.topojson.feature(brasil, brasil.objects.BRBR).features[0],
						showOutline: true,
						data: unidades
					}]
				},
				options: {
					plugins: {
						title: {
							display: true,
							text: titulo,
							padding: { bottom: 10 }
						},
						subtitle: {
							display: (subtitulo.length > 0),
							text: subtitulo,
							padding: { bottom: 20 }
						},
						legend: {
							display: false
						},
					},
					scales: {
						projection: {
							axis: "x",
							projection: "mercator"  
						},
						color: {
							axis: "x",
							quantize: faixas,
							interpolate: paleta,
							legend: {
								position: "bottom-right",
								align: "left"
							},
						}
					},
				}
			};
			
			mostrarChart(config);
			
			plotBtn.html(plotBtnHtml);
			plotBtn.prop("disabled", false).removeClass("disabled");
			
		});
		
	}

	function setupBtnLoad() {
		
		$("#btn-load").click(function() {

			const loadBtnHtml = loadBtn.html();
			
			const codigo = inputAgregado.val();
			const url = `https://apisidra.ibge.gov.br/DescritoresTabela/t/${codigo}`;
			
			inputAgregado.val("");
			
			loadBtn.html(`<div class="loader"></div>`);
			loadBtn.prop("disabled", true).addClass("disabled");
			
			$.ajax({
				url: url,
				method: "GET",
				dataType: "json",
				success: function (metadados) {
					
					console.log(metadados);
					
					_metadados = metadados;
					
					agregarUnidades();
					
					mostrarMetadados();
					mostrarTipos();
					mostrarChartForm();
					
				},
				complete: async function() {
					
					loadBtn.html(loadBtnHtml);
					loadBtn.prop("disabled", false).removeClass("disabled");
					
				}
			});
			
		});
	
	}

	function setupModalToggles() {
		
		$(document).on("click", "#modal-toggles #btn-all", function() {
			
			const param = $("#modal-toggles").data("param");
			const paramId = $("#modal-toggles").data("param-id");
			
			if (param == "p") {
				
				_metadados
				.Periodos
				.forEach(x => { x.TmpMostrar = true; });
				
			} else if (param == "c") {
				
				_metadados
				.Classificacoes
				.find(x => x.Id == paramId)
				.Categorias
				.forEach(x => { x.TmpMostrar = true; });
				
			} else if (param == "n") {
			
				_metadados
				.NiveisTerritoriais
				.find(x => x.Id == paramId)
				.Unidades
				.forEach(x => { x.TmpMostrar = true; });
				
			}
			
			$("#modal-toggles .form-check-input").prop("checked", true);
			
		});
		
		$(document).on("click", "#modal-toggles #btn-none", function() {
			
			const param = $("#modal-toggles").data("param");
			const paramId = $("#modal-toggles").data("param-id");
			
			if (param == "p") {
				
				_metadados
				.Periodos
				.forEach(x => { x.TmpMostrar = false; });
				
			} else if (param == "c") {
				
				_metadados
				.Classificacoes
				.find(x => x.Id == paramId)
				.Categorias
				.forEach(x => { x.TmpMostrar = false; });
				
			} else if (param == "n") {
			
				_metadados
				.NiveisTerritoriais
				.find(x => x.Id == paramId)
				.Unidades
				.forEach(x => { x.TmpMostrar = false; });
				
			}
		
			$("#modal-toggles .form-check-input").prop("checked", false);
			
		});
		
		$(document).on("change", "#modal-toggles .form-check-input", function() {
			
			const param = $("#modal-toggles").data("param");
			const paramId = $("#modal-toggles").data("param-id");
			
			const id = $(this).data("id");
			const mostrar = $(this).prop("checked");
			
			if (param == "p") {
				
				_metadados
				.Periodos
				.find(x => x.Codigo == id)
				.TmpMostrar = mostrar;
				
			} else if (param == "c") {
				
				_metadados
				.Classificacoes
				.find(x => x.Id == paramId)
				.Categorias
				.find(x => x.Id == id)
				.TmpMostrar = mostrar;
				
			} else if (param == "n") {
			
				_metadados
				.NiveisTerritoriais
				.find(x => x.Id == paramId)
				.Unidades
				.find(x => x.Codigo == id)
				.TmpMostrar = mostrar;
				
			}
			
		});
		
		$(document).on("click", "#modal-toggles-btn-save", function() {
			
			const formId = $("#modal-toggles").data("form");
			const param = $("#modal-toggles").data("param");
			const paramId = $("#modal-toggles").data("param-id");
			
			if (param == "p") {
				
				var qnt = 
					_metadados
					.Periodos
					.filter(x => x.TmpMostrar ?? true)
					.length;
				
				if (qnt == 0) {
				
					$("#modal-toggles-span-error").html("Erro: Selecione pelo menos um item!");
					
					return;
				
				}
				
				_metadados
				.Periodos
				.forEach(x => { x.Mostrar = x.TmpMostrar; });
				
				var periodos = 
					_metadados
					.Periodos
					.filter(x => x.Mostrar ?? true)
					.map((x) => x.Nome);
				
				var subtexto = truncar(periodos.join(", "), 35);
				
				$(`#${formId} #subtexto-eixo-x`).html(subtexto);
				
			} else if (param == "c") {
			
				var qnt = 
					_metadados
					.Classificacoes
					.find(x => x.Id == paramId)
					.Categorias
					.filter(x => x.TmpMostrar ?? true)
					.length;
				
				if (qnt == 0) {
				
					$("#modal-toggles-span-error").html("Erro: Selecione pelo menos um item!");
					
					return;
				
				}
				
				_metadados
				.Classificacoes
				.find(x => x.Id == paramId)
				.Categorias
				.forEach(x => { x.Mostrar = x.TmpMostrar; });
				
				var categorias = 
					_metadados
					.Classificacoes
					.find(x => x.Id == paramId)
					.Categorias
					.filter(x => x.Mostrar ?? true)
					.map(x => x.Nome);
					
				var subtexto = truncar(categorias.join(", "), 35);
				
				$(`#${formId} #subtexto-c-${paramId}`).html(subtexto);
				
			} else if (param == "n") {
			
				var qnt = 
					_metadados
					.NiveisTerritoriais
					.find(x => x.Id == paramId)
					.Unidades
					.filter(x => x.TmpMostrar ?? true)
					.length;
				
				if (qnt == 0) {
				
					$("#modal-toggles-span-error").html("Erro: Selecione pelo menos um item!");
					
					return;
				
				}
				
				_metadados
				.NiveisTerritoriais
				.find(x => x.Id == paramId)
				.Unidades
				.forEach(x => { x.Mostrar = x.TmpMostrar; });
				
				var unidades = 
					_metadados
					.NiveisTerritoriais
					.find(x => x.Id == paramId)
					.Unidades
					.filter(x => x.Mostrar ?? true)
					.map(x => x.Nome);
					
				var subtexto = truncar(unidades.join(", "), 35);
				
				$(`#${formId} #subtexto-nivel-territorial`).html(subtexto);
				
			}
			
			$("#modal-toggles").modal("hide");
			
		});
	
		$("#modal-toggles").on("hide.bs.modal", function() {
			
			$("#modal-toggles-span-error").html("");
			
		});
		
	}

	function aplicarTema(tema) {
	
		document.documentElement.setAttribute("data-bs-theme", tema);
		localStorage.setItem("tema", tema);

		const escuro = tema === "dark";
		$("#theme-toggle i")
		.toggleClass("bi-moon-stars-fill", !escuro)
		.toggleClass("bi-sun-fill", escuro);
		
		$("#theme-toggle")
		.attr("aria-label", escuro ? "Ativar modo claro" : "Ativar modo escuro");

		if (_chart) {
	
			const cor = getComputedStyle(document.documentElement)
			.getPropertyValue("--bs-body-color").trim();
			_chart.options.color = cor;
			_chart.update();
		}
		
	}

	$(function () {
	
		aplicarTema(localStorage.getItem("tema") || "light");

		$("#theme-toggle").on("click", function () {
	
			const temaAtual = document.documentElement.getAttribute("data-bs-theme");
			aplicarTema(temaAtual === "dark" ? "light" : "dark");
		});
		
	});
	
	// ...
	
	$(document).ready(function () {
		
		setup();
		
		setupBtnLoad();
		setupBtnPlot();
		setupSelectTipo();
		setupModalToggles();
		
	});
